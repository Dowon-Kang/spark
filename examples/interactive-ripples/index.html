<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>spark | splat-shockwave</title>
  <style>
    html, body, #canvas { width: 100%; height: 100%; margin: 0; padding: 0; display: block; }
    body { background: #000; overflow: hidden; }
    .legend {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 16px;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 15px;
      border-radius: 5px;
      pointer-events: none;
      z-index: 100;
    }
    /* [OSS Edition] 놀이터 모드 HUD */
    #hud {
      position: absolute; right: 20px; bottom: 20px;
      color: #fff; font-family: Arial, sans-serif; text-align: center;
      background: rgba(10, 10, 20, 0.55); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px;
      padding: 10px 18px; pointer-events: none; z-index: 100;
    }
    #hud:empty { display: none; }
    #hud .mode { font-size: 22px; font-weight: bold; }
    #hud .keys span { display: inline-block; margin: 6px 4px 2px; padding: 2px 8px; border-radius: 8px; font-size: 13px; opacity: 0.55; }
    #hud .keys span.on { opacity: 1; background: rgba(255, 80, 220, 0.45); }
    #hud .stat { font-size: 13px; opacity: 0.85; }
    #hud .combo { color: #ffd23f; font-size: 16px; }
  </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="hud"></div>
    <div class="legend">
      <b>OSS개론 Edition · 놀이터</b> · 클릭! · 1~4 효과 바꾸기 · Space 랜덤 · 연타하면 콤보 · WASD 이동<br>
      <small>다른 장면: 주소 끝에 <code>?scene=fireplace.spz</code> (벽난로) / <code>?scene=forge.spz</code> (대장간 모루) · 원본 효과와 비교: <code>?preset=original</code></small>
    </div>
    <!-- [OSS Edition] 빌드 없이(GitHub Pages) 동작하도록 import map 추가:
         three.js는 CDN, Spark는 저장소에 커밋된 dist/ 사용 -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
          "@sparkjsdev/spark": "../../dist/spark.module.js"
        }
      }
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
