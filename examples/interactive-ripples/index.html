<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spark 놀이터 | OSS개론 Edition</title>
  <style>
    html, body, #canvas { width: 100%; height: 100%; margin: 0; padding: 0; display: block; }
    body { background: #000; overflow: hidden; font-family: Arial, sans-serif; }
    .legend {
      position: absolute; top: 20px; left: 20px; color: white; font-size: 15px;
      background: rgba(0, 0, 0, 0.6); padding: 10px 15px; border-radius: 8px;
      pointer-events: none; z-index: 100; max-width: 60vw;
    }
    /* [OSS Edition] 놀이터 HUD (오른쪽 아래) */
    #hud {
      position: absolute; right: 20px; bottom: 20px; color: #fff; text-align: center;
      background: rgba(10, 10, 20, 0.55); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px;
      padding: 10px 16px; pointer-events: none; z-index: 100;
    }
    #hud:empty { display: none; }
    #hud .mode { font-size: 22px; font-weight: bold; }
    #hud .keys span { display: inline-block; margin: 6px 3px 2px; padding: 2px 7px; border-radius: 8px; font-size: 13px; opacity: 0.55; }
    #hud .keys span.on { opacity: 1; background: rgba(255, 80, 220, 0.45); }
    #hud .stat { font-size: 13px; opacity: 0.85; }
    #hud .combo { color: #ffd23f; font-size: 16px; }
    /* [OSS Edition] 🧪 실험실 패널 (오른쪽 위) */
    #lab-toggle {
      position: absolute; top: 20px; right: 20px; z-index: 101; cursor: pointer;
      color: #fff; background: rgba(124, 77, 255, 0.75); border: 0; border-radius: 12px;
      padding: 8px 14px; font-size: 15px;
    }
    #lab {
      position: absolute; top: 64px; right: 20px; width: 300px; z-index: 101; color: #fff;
      background: rgba(10, 10, 20, 0.8); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 14px; padding: 12px 14px; font-size: 14px;
    }
    #lab[hidden] { display: none; }
    #lab .row { display: flex; align-items: center; gap: 8px; margin: 7px 0; }
    #lab .row label { width: 46px; }
    #lab input[type="range"] { flex: 1; }
    #lab code {
      display: block; white-space: pre-wrap; word-break: break-all; font-size: 11.5px;
      background: rgba(255, 255, 255, 0.08); border-radius: 8px; padding: 8px; margin: 8px 0; user-select: all;
    }
    #lab button { cursor: pointer; border: 0; border-radius: 8px; padding: 6px 10px; background: #ff4de1; color: #fff; }
    #lab small { display: block; opacity: 0.7; margin-top: 6px; line-height: 1.4; }
  </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div class="legend">
      <b>Spark 놀이터 · OSS개론 Edition</b> — 클릭! · 숫자키로 효과 바꾸기 · Space 랜덤 · 연타하면 콤보 · WASD 이동<br>
      <small>다른 장면: 주소 끝에 <code>?scene=fireplace.spz</code> / <code>?scene=forge.spz</code> · 원본과 비교: <code>?preset=original</code></small>
    </div>
    <div id="hud"></div>

    <!-- [OSS Edition] 🧪 실험실: 값을 바꿔 보고 코드 한 줄을 복사해 main.js의 MY_EFFECTS에 붙여넣기 -->
    <button id="lab-toggle">🧪 실험실 (L)</button>
    <div id="lab" hidden>
      <div><b>🧪 실험실</b> · <span id="lab-name"></span></div>
      <div class="row"><label>종류</label><select id="lab-type"></select></div>
      <div class="row"><label>범위</label><input type="range" id="lab-size" min="0.2" max="3" step="0.1"><span id="lab-size-v"></span></div>
      <div class="row"><label>세기</label><input type="range" id="lab-strength" min="0.2" max="3" step="0.1"><span id="lab-strength-v"></span></div>
      <div class="row"><label>속도</label><input type="range" id="lab-speed" min="0.2" max="3" step="0.1"><span id="lab-speed-v"></span></div>
      <div class="row"><label>색</label><input type="color" id="lab-color" value="#ff4de1"><label style="width:auto"><input type="checkbox" id="lab-random"> 랜덤</label></div>
      <code id="lab-code"></code>
      <button id="lab-copy">📋 이 줄 복사</button>
      <small>복사한 줄을 GitHub에서 <b>main.js</b>의 <b>MY_EFFECTS</b> 안, 같은 키 줄과 바꿔 커밋하면 내 효과로 저장돼요. (새로고침하면 실험실 값은 사라져요)</small>
    </div>

    <!-- [OSS Edition] 빌드 없이(GitHub Pages) 동작하도록 import map 추가:
         three.js는 CDN, Spark는 저장소에 커밋된 dist/ 사용 -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
          "@sparkjsdev/spark": "../../dist/spark.module.js"
        }
      }
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
